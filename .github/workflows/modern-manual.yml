name: Modern Manual Validation

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      upload_artifacts:
        description: Upload modern build and test artifacts
        required: true
        default: true
        type: boolean
      include_legacy_validation:
        description: Run the legacy Windows validation job
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: modern-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-modern:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Unified Command Script
        run: bash -n start_scanfolder.command

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props
            global.json
            ScanFolderToFile.Modern.sln

      - name: Restore
        run: dotnet restore ScanFolderToFile.Modern.sln --locked-mode --nologo

      - name: Check Formatting
        run: dotnet format --verify-no-changes ScanFolderToFile.Modern.sln

      - name: Build
        run: dotnet build ScanFolderToFile.Modern.sln -c ${{ inputs.configuration }} -p:UseAppHost=true --no-restore --nologo -v minimal

      - name: Test With Coverage
        run: dotnet test ScanFolderToFile.Modern.sln -c ${{ inputs.configuration }} --no-build --nologo -v minimal --logger "trx;LogFileName=test-results.trx" --results-directory "artifacts/test-results" --collect:"XPlat Code Coverage;Format=cobertura"

      - name: Publish Self-Contained macOS App
        run: dotnet publish src/ScanFolderToFile.App/ScanFolderToFile.App.csproj -f net10.0 -c ${{ inputs.configuration }} -r osx-arm64 --self-contained true -p:UseAppHost=true --no-restore --nologo -v minimal -o artifacts/publish/osx-arm64

      - name: Create macOS Bundle
        run: bash scripts/create_macos_bundle.sh artifacts/publish/osx-arm64 dist/ScanFolderToFile.app

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Reports
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"artifacts/test-results/**/coverage.cobertura.xml" \
            -targetdir:"artifacts/coverage/full" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura"
          reportgenerator \
            -reports:"artifacts/test-results/**/coverage.cobertura.xml" \
            -targetdir:"artifacts/coverage/code" \
            -reporttypes:"TextSummary;Cobertura" \
            -filefilters:"-*.axaml"

      - name: Verify Coverage Thresholds
        run: |
          COVERAGE_FILE="artifacts/coverage/code/Cobertura.xml"
          if [[ ! -f "$COVERAGE_FILE" ]]; then
            echo "Coverage file not found." >&2
            exit 1
          fi
          python3 - "$COVERAGE_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          coverage_path = sys.argv[1]
          root = ET.parse(coverage_path).getroot()
          line_rate = float(root.attrib.get("line-rate", "0")) * 100
          branch_rate = float(root.attrib.get("branch-rate", "0")) * 100
          print(f"Line coverage: {line_rate:.2f}%")
          print(f"Branch coverage: {branch_rate:.2f}%")
          if line_rate < 88 or branch_rate < 71:
              raise SystemExit(1)
          PY

      - name: Upload Modern Artifacts
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: modern-manual-artifacts
          path: |
            artifacts/test-results/**
            artifacts/coverage/**
            artifacts/publish/**
            dist/ScanFolderToFile.app/**
            src/ScanFolderToFile.App/bin/${{ inputs.configuration }}/net10.0/**
            scripts/create_macos_bundle.sh
            start_scanfolder.command
          if-no-files-found: warn
          retention-days: 30

  legacy-validation:
    if: ${{ inputs.include_legacy_validation }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore Legacy Packages
        run: nuget restore scanFolderToFile.sln

      - name: Build Legacy Solution
        run: msbuild scanFolderToFile.sln /p:Configuration=Debug
